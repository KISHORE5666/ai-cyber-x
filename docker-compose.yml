version: "3.9"

services:
  # ── Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ai-cyber-x-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - cyber-net

  # ── Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: ai-cyber-x-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cyberx:cyberx_pass@postgres:5432/cyberxdb
      - REDIS_URL=redis://redis:6379/0
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-ai-cyber-x-secret-change-in-production}
      - ENVIRONMENT=production
    depends_on:
      - postgres
      - redis
      - elasticsearch
      - kafka
    restart: unless-stopped
    networks:
      - cyber-net
    volumes:
      - ./backend:/app
      - malware_samples:/app/samples

  # ── PostgreSQL ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ai-cyber-x-postgres
    environment:
      POSTGRES_DB: cyberxdb
      POSTGRES_USER: cyberx
      POSTGRES_PASSWORD: cyberx_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - cyber-net

  # ── Redis ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ai-cyber-x-redis
    command: redis-server --requirepass cyberx_redis_pass --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - cyber-net

  # ── Elasticsearch ──────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: ai-cyber-x-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=cyberx_elastic_pass
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - cyber-net

  # ── Kibana ─────────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: ai-cyber-x-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=cyberx_elastic_pass
    depends_on:
      - elasticsearch
    restart: unless-stopped
    networks:
      - cyber-net

  # ── Kafka ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ai-cyber-x-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - cyber-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-cyber-x-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 72
    depends_on:
      - zookeeper
    networks:
      - cyber-net

  # ── MongoDB ────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: ai-cyber-x-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: cyberx
      MONGO_INITDB_ROOT_PASSWORD: cyberx_mongo_pass
      MONGO_INITDB_DATABASE: cyberx_threat_intel
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - cyber-net

  # ── Neo4j (Attack Graph) ───────────────────────────────
  neo4j:
    image: neo4j:5.15
    container_name: ai-cyber-x-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/cyberx_neo4j_pass
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - cyber-net

  # ── Prometheus ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.49.0
    container_name: ai-cyber-x-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped
    networks:
      - cyber-net

  # ── Grafana ────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.3
    container_name: ai-cyber-x-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: cyberx_grafana_pass
      GF_INSTALL_PLUGINS: grafana-worldmap-panel,grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - cyber-net

  # ── MLflow ─────────────────────────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: ai-cyber-x-mlflow
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri postgresql://cyberx:cyberx_pass@postgres:5432/mlflow
    depends_on:
      - postgres
    networks:
      - cyber-net

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  mongodb_data:
  neo4j_data:
  prometheus_data:
  grafana_data:
  malware_samples:

networks:
  cyber-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
